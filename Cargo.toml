[workspace]
resolver = "3"
members = ["crates/game_core", "crates/server", "crates/net_client", "crates/client"]

[workspace.package]
version = "1.0.2"
edition = "2024"

[workspace.dependencies]
game_core = { path = "crates/game_core" }
net_client = { path = "crates/net_client" }
bevy = "0.19"
bevy_renet = "5.0"
renet = "2.0"
renet_netcode = "2.0"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
