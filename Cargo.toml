[workspace]
resolver = "3"
members = ["crates/game_core", "crates/server", "crates/net_client"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
game_core = { path = "crates/game_core" }
net_client = { path = "crates/net_client" }
renet = "2.0"
renet_netcode = "2.0"
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
rand = "0.9"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
